# ALSA routing: gmediarender (alsasink) -> FIFO read by snapserver.
# gmediarender already delivers S16_LE at SAMPLE_RATE (GStreamer audioresample, see
# docker/entrypoint.sh), so the rate plugin only passes the samples through.
# rate must equal SAMPLE_RATE and snapserver's sampleformat.
pcm.!default {
    type plug
    slave.pcm rate44100Hz
}

pcm.rate44100Hz {
    type rate
    slave {
        pcm writeFile # Direct to the plugin which will write to a file
        format S16_LE
        rate 44100
    }
}

pcm.writeFile {
    type file
    slave.pcm null
    file "/tmp/music/upnpfifo"
    format "raw"
}
